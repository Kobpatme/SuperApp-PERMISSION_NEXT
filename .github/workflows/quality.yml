name: quality

on:
  pull_request:
  push:
    branches: [main, codex/ux-login-polish]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ux_fixture
          POSTGRES_PASSWORD: ux_fixture_only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ux_fixture -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      UX_TEST_DATABASE_URL: postgres://ux_fixture:ux_fixture_only@127.0.0.1:5432/postgres
      CAR_BOOKING_TEST_DATABASE_URL: postgres://ux_fixture:ux_fixture_only@127.0.0.1:5432/permission_next_car_booking_test
      TRUSTED_PROXY_COUNT: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:css
      - run: npm run check:contrast
      - run: node scripts/check-ui-copy.mjs
      - run: npm test
      - run: npm run test:documents
      - run: npm run test:car:schema
      - run: npm run test:car:services
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm run test:ux:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:car:browser
      - run: npm run test:e2e
        env:
          UX_PHASE: cp5-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-browser-evidence
          path: |
            test-results/
            docs/quality/ux-login-evidence/e2e-results.json
            docs/quality/ux-login-evidence/cp5-ci-*.png
            docs/quality/ux-login-evidence/cp5-ci-motion-*.json
            docs/quality/ux-login-evidence/font-budget.json
            docs/quality/car-booking-phase-3/e2e-results.json
            docs/quality/car-booking-phase-3/*.png
            docs/quality/car-booking-phase-4/e2e-results.json
            docs/quality/car-booking-phase-4/performance.json
            docs/quality/car-booking-phase-4/*.png
          retention-days: 14
